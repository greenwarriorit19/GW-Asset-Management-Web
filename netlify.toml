# Netlify build settings. The app is a static SPA on a hash router, so no redirect rules are needed.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Site settings → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
